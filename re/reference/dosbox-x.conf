# Reference environment for El Tesoro de Isla Alcachofa: Windows 95 in DOSBox-X, run from a local copy of the image.
# Start with re/reference/run.sh. The image (local-media/reference/win95-work.img) is a clone of the original Win95.img, which stays unchanged.
[sdl]
output=surface
windowresolution=800x600
fullscreen=false

[dosbox]
machine=svga_s3
memsize=64
captures=re/captures
title=Tesoro reference

[cpu]
cputype=pentium
core=normal
cycles=max

[render]
aspect=false

[parallel]
parallel1=disabled
parallel2=disabled
parallel3=disabled

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[ide, primary]
enable=true

[ide, secondary]
enable=true

[autoexec]
imgmount 2 "local-media/reference/win95-work.img" -t hdd -fs none -size 512,63,64,1015
imgmount d "/Users/gabriel/Desktop/ags/TESORO/Tesoro.cue" -t iso -fs iso -ide 2m
boot -l c
